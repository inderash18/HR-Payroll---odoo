name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peoplepay360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Client generation
        run: npm --prefix server run prisma:generate

      - name: Run Backend Vitest Tests
        run: npm --prefix server run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/peoplepay360?schema=public
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_minimum_32_chars
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_minimum_32_chars
          COOKIE_SECRET: test_cookie_secret_key_minimum_32_chars

      - name: Build Frontend Production Bundle
        run: npm --prefix client run build
